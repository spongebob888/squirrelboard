# Serve the contents of `dist/` from /srv/squirrelboard.
# Add TLS here or terminate HTTPS at your existing ingress.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /srv/squirrelboard;
    index index.html;

    # Preserve the original, percent-encoded URI (outbound tags may contain /).
    # No trailing slash or URI component on proxy_pass.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        # Browser WebSockets authenticate with a token query parameter.
        access_log off;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
