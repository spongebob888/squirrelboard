name: Release dashboard

on:
  push:
    tags: ['v**']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build dashboard
        run: pnpm build

      - name: Build single-file dashboard
        run: pnpm build:single

      - name: Package dashboard
        working-directory: dist
        run: zip -r ../dist.zip .

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist.zip dist-single/index.html --clobber
          else
            gh release create "$RELEASE_TAG" dist.zip dist-single/index.html --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
